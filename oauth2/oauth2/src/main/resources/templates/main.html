<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<main layout:fragment="content" class="container-fluid my-4" style="margin-left:0; margin-right:0; width: 100%;">

    <link rel="stylesheet" href="/css/oauth/main.css">
    <!-- Bootstrap CSS -->
<!--    <link href="//netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">-->
<!--    &lt;!&ndash; Font Awesome &ndash;&gt;-->
<!--    <link href="//netdna.bootstrapcdn.com/font-awesome/4.0.0/css/font-awesome.css" rel="stylesheet">-->
    <div class="container-fluid">
        <div class="main-container">
            <!-- 이메일 값이 있을 때만 보여줌 -->
            <div class="form-user" th:if="${email != null and email != ''}">
                <!-- 프로필 사진 -->

                <img th:if="${PhotoNo != null and PhotoNo != ''}" th:src="|${PhotoNo}|" alt="Profile Picture" class="profile-img" onclick="document.getElementById('file-input').click();">

                <!-- profilePhto 값이 null이거나 빈 문자열일 경우 -->
                <img th:if="${PhotoNo == null or PhotoNo == ''}" src="https://static.nid.naver.com/images/web/user/default.png?type=s160" alt="Profile Picture" class="profile-img" onclick="document.getElementById('file-input').click();">

                <!-- 파일 업로드 input -->
                <input type="file" id="file-input" class="file-input" accept="image/*" onchange="updateProfileImage(event)" style="display: none;">

                <!-- 로그인 사용자 이름 -->

                <div class="username" th:text="${name}"></div>

                <!-- 사용자 이메일 -->
                <div class="user-email" th:text="${email}"></div> <!-- 사용자 이메일 -->


                <!-- 로그아웃 버튼 -->
                <button class="btn btn-lg btn-danger btn-block btn-center" style="padding: 8px 16px;" onclick="logout()">로그아웃</button>

                <!-- 블로그 이동 버튼 -->
                <button class="btn btn-lg btn-primary btn-block btn-center" style="padding: 8px 16px;" onclick="location.href='http://d.0neteam.co.kr:8002/로그인한User의boardNo'">내 블로그</button>

                <!-- 카페 이동 버튼 -->
                <button class="btn btn-lg btn-primary btn-block btn-center" style="padding: 8px 16px;" onclick="location.href='http://d.0neteam.co.kr:8001'">내 카페</button>

            </div>

            <div class="content-wrapper">
                <!-- Cafe List Section -->
                <div class="cafe" >
                    <h3>카페 글 목록</h3>
                    <ul>
                        <li th:each="cafe : ${cafeList}">
<!--                            <a th:href="@{${cafe.link}}" th:text="${cafe.title}">카페 글 제목</a>-->
                            <a th:text="${cafe.title}" style="margin-left:5px;">카페 글 제목</a>
                        </li>
                    </ul>

                    <!-- 더보기 링크 추가 -->
                    <a href="http://d.0neteam.co.kr:8001" class="btn btn-link position-absolute bottom-0 end-0 p-3">+ 더보기</a>
                </div>

                <!-- Blog List Section -->
                <div class="blog" >
                    <h3>블로그 글 목록</h3>
                    <ul>
                        <li th:each="blog : ${blogList}">
<!--                            <a th:href="@{${blog.link}}" th:text="${blog.title}">블로그 글 제목</a>-->
                            <a th:text="${blog.title}" style="margin-left:5px;">블로그 글 제목</a>
                        </li>
                    </ul>

                    <!-- 더보기 링크 추가 -->
                    <a href="http://d.0neteam.co.kr:8002" class="btn btn-link position-absolute bottom-0 end-0 p-3">+ 더보기</a>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap JS -->
<!--    <script src="//code.jquery.com/jquery-1.11.1.min.js"></script>-->
<!--    <script src="//netdna.bootstrapcdn.com/bootstrap/3.0.0/js/bootstrap.min.js"></script>-->
<!--    &lt;!&ndash; Axios &ndash;&gt;-->
<!--    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>-->
    <script src="/js/oauth/main.js" type="text/javascript" ></script>


</main>
</html>
