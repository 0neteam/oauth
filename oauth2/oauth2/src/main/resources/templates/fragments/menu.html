<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" >
<nav th:fragment="menu" class="navbar navbar-expand-sm border-bottom">

    <div class="container-fluid" style="height:50px; margin-left: 30px; display: flex; flex-wrap: nowrap;">

        <div class="d-flex flex-wrap justify-content-between align-items-center w-100">
            <span class="navbar-brand d-flex align-items-center p-0">
                <a href="/">
                    <img class="ms-2" src="/img/logo_oneteam.png" alt="oneteam logo" height="45px">
                </a>
            </span>
        </div>

        <!-- Updated menubar styling -->
        <div class="menubar" style="width: 100%; display: flex; justify-content: flex-end;" >
            <div th:if="${email == null}" style="width: 100%; display: flex; justify-content: flex-end;">
                <div style="margin-right:30px;"><a href="/signIn" >로그인</a></div>
                <div style="margin-right:30px;"><a href="/signUp" >회원가입</a></div>
            </div>

            <div th:if="${email != null and email != ''}" style="width: 100%; display: flex; justify-content: flex-end;">
                <div style="margin-right:30px;"><a href="http://d.0neteam.co.kr:8002" >블로그홈</a></div>
                <div style="margin-right:30px;"><a href="http://d.0neteam.co.kr:8001" >카페홈</a></div>
                <div style="margin-right:30px;"><a href="/MyPageInfo" >내정보</a></div>
                <div style="margin-right:30px;"><a href="/oauth2/logout">로그아웃</a></div>

            </div>
        </div>

    </div>
    
</nav>
</html>
